services:
  backend:
    build: ./backend
    container_name: livingworth-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MENTOR_NAME: ${MENTOR_NAME}
      MENTOR_EMAIL: ${MENTOR_EMAIL}
      MENTOR_PASSWORD: ${MENTOR_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      EMAIL_REMINDERS_ENABLED: ${EMAIL_REMINDERS_ENABLED:-false}
      REMINDER_CHECK_MINUTES: ${REMINDER_CHECK_MINUTES:-5}
      QUIZ_REMINDER_MINUTES: ${QUIZ_REMINDER_MINUTES:-30}
      CLASS_REMINDER_MINUTES: ${CLASS_REMINDER_MINUTES:-60}
      CLASS_TIME: ${CLASS_TIME:-20:00}
      CLASS_TIMEZONE: ${CLASS_TIMEZONE:-Africa/Lagos}
      CLASS_MEETING_LINK: ${CLASS_MEETING_LINK:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - learning_uploads:/app/uploads
    networks: [livingworth]

  frontend:
    build: ./frontend
    container_name: livingworth-frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [livingworth]

  nginx:
    image: nginx:1.27-alpine
    container_name: livingworth-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
    networks: [livingworth]

volumes:
  learning_uploads:

networks:
  livingworth:
    driver: bridge
