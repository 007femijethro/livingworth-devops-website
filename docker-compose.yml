services:
  mysql:
    image: mysql:8.4
    container_name: livingworth-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [livingworth]

  backend:
    build: ./backend
    container_name: livingworth-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MENTOR_NAME: ${MENTOR_NAME}
      MENTOR_EMAIL: ${MENTOR_EMAIL}
      MENTOR_PASSWORD: ${MENTOR_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - learning_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks: [livingworth]

  frontend:
    build: ./frontend
    container_name: livingworth-frontend
    restart: unless-stopped
    depends_on: [backend]
    networks: [livingworth]

  nginx:
    image: nginx:1.27-alpine
    container_name: livingworth-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, backend]
    networks: [livingworth]

volumes:
  mysql_data:
  learning_uploads:

networks:
  livingworth:
    driver: bridge
