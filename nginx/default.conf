upstream frontend {
    server frontend:80;
}

upstream backend {
    server backend:5000;
}

upstream bank_master {
    server bank-master-app:5000;
}

log_format livingworth_json escape=json '{"timestamp":"$time_iso8601","level":"info","service":"livingworth-nginx","event":"http_access","requestId":"$request_id","remoteAddr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"requestTime":$request_time,"upstreamTime":"$upstream_response_time","bytes":$body_bytes_sent,"host":"$host","userAgent":"$http_user_agent"}';
access_log /dev/stdout livingworth_json;
error_log /dev/stderr warn;

# =====================================================
# BRIDGESS / LIVINGWORTH
# =====================================================

server {
    listen 80;
    server_name bridgess.co.uk;

    return 301 https://bridgess.co.uk$request_uri;
}

server {
    listen 443 ssl;
    server_name bridgess.co.uk;

    ssl_certificate /etc/letsencrypt/live/bridgess.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridgess.co.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 76m;

    location /api/ {
        proxy_pass http://backend;

        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;

        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =====================================================
# REDBIRD FCU / BANK MASTER
# =====================================================

server {
    listen 80;
    server_name redbirdfcu.com www.redbirdfcu.com;

    return 301 https://redbirdfcu.com$request_uri;
}

server {
    listen 443 ssl;
    server_name redbirdfcu.com www.redbirdfcu.com;

    ssl_certificate /etc/letsencrypt/live/redbirdfcu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redbirdfcu.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 76m;

    location / {
        proxy_pass http://bank_master;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
