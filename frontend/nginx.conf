# Evaluate the original URL, including query strings, even after SPA internal rewrites.
map $request_uri $academy_robots {
  default "noindex, nofollow";
  ~^/(?:\?(?:utm_[^=]+|gclid|fbclid)=[^&]*(?:&(?:utm_[^=]+|gclid|fbclid)=[^&]*)*)?$ "index, follow";
  ~^/(?:apply/?|portfolio/?|privacy\.html|terms-and-conditions\.html)$ "index, follow";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  add_header X-Robots-Tag $academy_robots always;
  location = / { try_files /index.html =404; }
  location ~ ^/(apply|register)/?$ { try_files /apply/index.html =404; }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /app-shell.html; }
}
