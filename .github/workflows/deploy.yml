name: Deploy Livingworth

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/livingworth-devops-website

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            if [ ! -f .lw-supabase-migrated ]; then
              echo "Preparing one-time MySQL to Supabase migration..."
              sudo docker compose up -d mysql
              sudo docker compose build backend
              sudo docker stop livingworth-backend || true
              if sudo docker compose run --rm backend npm run migrate:legacy; then
                touch .lw-supabase-migrated
                echo "Database migration completed and verified."
              else
                echo "Migration failed. Restoring the existing backend."
                sudo docker start livingworth-backend || true
                exit 1
              fi
            fi

            echo "Building application..."
            sudo docker compose up -d --build

            echo "Checking containers..."
            sudo docker compose ps

            echo "Testing application..."
            sleep 10
            curl -f http://localhost || exit 1
            curl -f http://localhost/api/health || exit 1

            echo "Deployment completed successfully"
