name: Build Android app
on:
  push:
    branches: [codex/android-app, main]
    paths: ['frontend/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check and bundle app
        working-directory: frontend
        run: npm run android:sync
      - name: Build test APK and run Android unit tests
        working-directory: frontend/android
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Livingworth-Academy-Android-test
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
