name: Build Android app
on:
  push:
    branches: [codex/android-app, main]
    paths: ['frontend/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:
concurrency:
  group: livingworth-android-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check and bundle app
        working-directory: frontend
        run: npm run android:sync
      - name: Build test APK and run Android unit tests
        working-directory: frontend/android
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        with:
          name: Livingworth-Academy-Android-test
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Restore permanent release signing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: node frontend/scripts/prepare-release-signing.mjs
      - name: Build and check signed release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: frontend/android
        run: |
          bash gradlew assembleRelease testReleaseUnitTest lintRelease
          signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$signer" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/release-verification.txt"
          node ../scripts/verify-release-certificate.mjs "$RUNNER_TEMP/release-verification.txt"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: Livingworth-Academy-Android-release
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
      - name: Remove temporary signing material
        if: always()
        run: node -e 'const fs=require("node:fs"),path=require("node:path");fs.rmSync(path.join(process.env.RUNNER_TEMP,"livingworth-release-signing"),{recursive:true,force:true})'
